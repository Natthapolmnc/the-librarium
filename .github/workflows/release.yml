name: Release Obsidian plugin

# Builds strictly from source using the committed pnpm-lock.yaml.
# Release artifacts are generated by CI only — no manually-built artifacts
# are uploaded.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update manifest version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"

          node -e "
            const fs = require('fs');
            const manifest = require('./manifest.json');
            manifest.version = '$VERSION';
            fs.writeFileSync(
              'manifest.json',
              JSON.stringify(manifest, null, 2) + '\n'
            );
          "

      - name: Update versions.json
        run: node scripts/version-update.mjs

      - name: Build plugin
        run: pnpm run build

      - name: Verify manifest version matches tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TAG="${TAG#v}"

          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")

          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "Tag ($TAG) does not match manifest.json version ($MANIFEST_VERSION)"
            exit 1
          fi

      - name: Verify release files exist
        run: |
          test -f main.js
          test -f manifest.json
          test -f versions.json

          if [ -f styles.css ]; then
            echo "styles.css found"
          else
            echo "No styles.css found, continuing"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            versions.json
            styles.css

      - name: Generate build attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            versions.json
            styles.css